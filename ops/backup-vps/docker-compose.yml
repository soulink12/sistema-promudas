# Roda no ZimaOS (não na VPS) — puxa um dump diário do MySQL da VPS via SSH
# e guarda compactado em /DATA/AppData/backup-promudas-vps/backups, que já
# cai no pipeline de backup pro OneDrive existente nesta máquina.
#
# Pré-requisito: uma chave SSH dedicada (só pra isso, não reaproveitar a
# hostinger_promudas) com a pública autorizada no root da VPS, montada
# read-only em /run/secrets/ssh_key.
services:
  backup-promudas-vps:
    build: .
    container_name: backup-promudas-vps
    restart: unless-stopped
    environment:
      VPS_HOST: 2.25.84.251
      VPS_USER: root
      CONTAINER_MYSQL: mysql
      RETENCAO_DIAS: "14"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/backup-promudas-vps/backups:/backups
      - /DATA/AppData/backup-promudas-vps/ssh_key:/run/secrets/ssh_key:ro
