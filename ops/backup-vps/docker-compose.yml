# Roda no ZimaOS (não na VPS) — puxa um dump diário do MySQL da VPS via SSH
# e guarda compactado em /DATA/Backup/Hostinger/MySQL (pasta compartilhada
# "Backup" do ZimaOS, namespace separado do backup antigo do sistema
# quando ele ainda rodava local em /DATA/Backup/MySQL).
#
# Pré-requisito: uma chave SSH dedicada (só pra isso, não reaproveitar a
# hostinger_promudas) com a pública autorizada no root da VPS, montada
# read-only em /run/secrets/ssh_key.
services:
  backup-promudas-vps:
    build: .
    image: localhost:5000/backup-promudas-vps:latest
    container_name: backup-promudas-vps
    restart: unless-stopped
    environment:
      VPS_HOST: 2.25.84.251
      VPS_USER: root
      CONTAINER_MYSQL: mysql
      RETENCAO_DIAS: "14"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/Backup/Hostinger/MySQL:/backups
      - /DATA/AppData/backup-promudas-vps/ssh_key:/run/secrets/ssh_key:ro
