name: frontpromudas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.4+5
environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.1.1
  desktop_updater: ^2.4.2
  dio: ^5.9.2
  file_picker: ^8.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # usado só nos testes para fingir o FilePicker (MockPlatformInterfaceMixin)
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# Ícone do app, gerado a partir de assets/icon/app_icon.png via:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
