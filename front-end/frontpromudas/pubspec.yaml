name: frontpromudas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.4+5
environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.1.1
  desktop_updater: ^2.4.2
  dio: ^5.9.2
  file_picker: ^8.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # usado só nos testes para fingir o FilePicker (MockPlatformInterfaceMixin)
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
