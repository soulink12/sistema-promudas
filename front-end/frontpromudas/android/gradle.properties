org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Evita o daemon externo do Kotlin: nessa combinação de versões (Gradle 8.14 +
# Kotlin 2.2.20) ele fixa o diretório de trabalho dentro do próprio cache que o
# Gradle tenta apagar em seguida, e no Windows isso quebra o build com
# "Unable to delete directory ... compileKotlin/cacheable" sempre, mesmo com
# daemon novo. Compilar dentro do próprio processo do Gradle evita o problema.
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
