services:
  mysql:
    # mysql:8.0 pra bater exatamente com o que já roda em produção no ZimaOS
    # (mesmo motor, sem variável nova nessa migração). Cogitamos mariadb:11
    # (suporte arm64 + paridade com dev local), mas revertido por segurança.
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - mysql-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  promudas-backend:
    build: .
    container_name: promudas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_HOST: mysql
      TZ: America/Sao_Paulo
    ports:
      - "6072:6072"
    volumes:
      - ./updates:/app/updates:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - appnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # network_mode: host porque o túnel foi configurado no dashboard da
    # Cloudflare apontando pro hostname "localhost:6072" — assim o
    # container enxerga a porta publicada pelo promudas-backend no próprio
    # host, sem precisar reconfigurar o túnel pra usar o nome do serviço.
    network_mode: host
    command: tunnel --no-autoupdate run
    env_file:
      - .env.docker
    depends_on:
      - promudas-backend

networks:
  appnet:
    driver: bridge

volumes:
  mysql-data:
